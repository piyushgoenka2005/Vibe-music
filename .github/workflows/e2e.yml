name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe -d vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://vibe:vibe@localhost:5432/vibe?schema=public
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_TEST_MODE: "true"
      DISABLE_RATE_LIMIT: "true"
      NEXT_PUBLIC_ENABLE_PAGE_LOAD_SPLASH: "false"
      NEXT_PUBLIC_ENABLE_SPLASH_CURSOR: "false"
      PLAYWRIGHT_WORKERS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Seed E2E prerequisites
        run: npx tsx scripts/db/seed-e2e-prereqs.mts

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            blob-report/
          retention-days: 14
          if-no-files-found: ignore
