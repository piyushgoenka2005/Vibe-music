# Manual staging validation — probe a deployed staging host before promoting to production.
name: Staging probe

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: "Staging base URL (e.g. https://staging.vibemusic.in)"
        required: true
        type: string

jobs:
  validate-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  probe-staging:
    needs: validate-repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_BASE_URL: ${{ inputs.staging_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Liveness + readiness
        run: |
          BASE="${VERIFY_BASE_URL%/}"
          curl -sf "${BASE}/api/healthz"
          curl -sf "${BASE}/api/readyz"

      - name: Staging sign-off probes
        run: npm run verify:prod-signoff
        env:
          REQUIRE_COMPLIANCE: "false"

      - name: Summary
        run: |
          echo "## Staging probe — ${VERIFY_BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Repo tests passed; live probes completed." >> "$GITHUB_STEP_SUMMARY"
