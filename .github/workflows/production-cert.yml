# Phase 11 — weekly production 20/20 certification probe.
name: Production 20/20 cert

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  certify:
    if: github.repository == 'piyushgoenka2005/Vibe-music'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Production 20/20 gate
        continue-on-error: true
        env:
          VERIFY_BASE_URL: https://vibemusic.in
        run: npm run verify:production-20
