# Nightly k6 smoke load test against a built Next.js server (L-25 / Phase 2)
name: Load test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  k6-smoke:
    if: github.repository == 'piyushgoenka2005/Vibe-music'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vibe:vibe@localhost:5432/vibe?schema=public
      AUTH_SECRET: ci-auth-secret-minimum-32-characters-long
      NEXTAUTH_SECRET: ci-auth-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      GUEST_ORDER_ACCESS_SECRET: ci-guest-order-secret-min-32-chars-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PORT: "3000"
      HOSTNAME: "127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Production build
        run: npm run build
        env:
          ALLOW_POSTGRES_DURING_BUILD: "true"

      - name: Start Next.js server
        run: |
          npm run start > /tmp/vibe-server.log 2>&1 &
          echo $! > /tmp/vibe-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/api/healthz" >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          tail -n 80 /tmp/vibe-server.log || true
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke (CI profile)
        run: k6 run -e BASE_URL=http://127.0.0.1:3000 -e VUS=5 -e DURATION=20s scripts/k6/smoke.js

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/vibe-server.pid ]; then
            kill "$(cat /tmp/vibe-server.pid)" || true
          fi
