# Scheduled production health probes (Phase 7)
name: Maintenance

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours — aligns with synthetic checkout monitor cadence
    - cron: "0 */6 * * *"

jobs:
  production-probes:
    if: github.repository == 'piyushgoenka2005/Vibe-music'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERIFY_BASE_URL: https://vibemusic.in
      REQUIRE_CDN_EDGE: ${{ vars.REQUIRE_CDN_EDGE || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Edge security (L-22 / L-23)
        id: edge
        continue-on-error: ${{ env.REQUIRE_CDN_EDGE != 'true' }}
        run: npm run verify:phase10

      - name: Liveness + readiness probes
        run: |
          curl -sf "${VERIFY_BASE_URL}/api/healthz"
          curl -sf "${VERIFY_BASE_URL}/api/readyz"

      - name: Synthetic checkout monitor
        run: npm run monitor:checkout

      - name: Production sign-off
        run: npm run verify:prod-signoff

      - name: L-30 compliance (GSTIN in homepage)
        id: compliance
        continue-on-error: true
        run: npm run verify:phase9

      - name: Strict compliance sign-off
        id: compliance_strict
        continue-on-error: true
        env:
          REQUIRE_COMPLIANCE: "true"
        run: npm run verify:prod-signoff

      - name: Dependency audit report (L-20)
        continue-on-error: true
        run: npm run audit:deps:report

      - name: Summarize probe results
        if: always()
        run: |
          echo "## Maintenance probe — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base URL: $VERIFY_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge check (L-22): ${{ steps.edge.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- L-30 compliance: ${{ steps.compliance.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict compliance: ${{ steps.compliance_strict.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [README.md](README.md) for production verification commands." >> "$GITHUB_STEP_SUMMARY"
