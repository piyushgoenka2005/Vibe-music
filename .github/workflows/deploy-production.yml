name: Deploy production (vibemusic.in)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vibemusic-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'piyushgoenka2005/Vibe-music'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          # Full pipeline on the VPS (npm ci + migrate + clean build) can take
          # well over the 10-minute default — give it headroom.
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/Vibe-music
            git fetch origin main
            git pull --ff-only origin main
            # update.sh already gates on /api/health internally; the final
            # smoke below runs once against the PUBLIC url (nginx + TLS path).
            SKIP_SMOKE=1 bash deploy/update.sh
            npm run publish:independence-banner || true
            BASE_URL=https://vibemusic.in bash deploy/post-deploy-smoke.sh
