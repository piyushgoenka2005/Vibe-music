name: Deploy production (vibemusic.in)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vibemusic-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'piyushgoenka2005/Vibe-music'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          # Full pipeline on the VPS (npm ci + migrate + clean build) can take
          # well over the 10-minute default — give it headroom.
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/Vibe-music
            git fetch origin main
            git pull --ff-only origin main
            # update.sh already gates on /api/health internally; the final
            # smoke below runs once against the PUBLIC url (nginx + TLS path).
            bash deploy/update.sh
            if grep -qE '^NEXT_PUBLIC_GSTIN=.{15}' deploy/ops-secrets.env 2>/dev/null; then
              SKIP_PULL=1 bash deploy/production.sh compliance
            fi
            npm run publish:independence-banner || true

      - name: Verify live commit matches main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERIFY_BASE_URL: https://vibemusic.in
        run: bash deploy/production.sh verify-sync
