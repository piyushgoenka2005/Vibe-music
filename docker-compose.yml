services:
  postgres:
    image: postgres:16
    container_name: vibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe
    ports:
      - "5432:5432"
    volumes:
      - vibe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vibe_pg_data:
