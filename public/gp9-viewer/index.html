<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roland GP-9 — Interactive 3D Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: radial-gradient(ellipse at 50% 40%, #1a1a1e 0%, #080808 70%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: #c9a962;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    #loading-progress {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      min-height: 1em;
    }

    /* Error */
    #error-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0,0,0,0.92);
      text-align: center;
    }
    #error-panel.visible { display: flex; flex-direction: column; gap: 1rem; }
    #error-panel h1 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.05em; }
    #error-panel p { max-width: 28rem; line-height: 1.6; color: rgba(255,255,255,0.65); font-size: 0.9rem; }

    /* Header badge */
    #brand {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      pointer-events: none;
    }
    #brand span {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    #brand strong {
      display: block;
      margin-top: 0.25rem;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    /* Control bar */
    #controls {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 20;
      transform: translateX(-50%);
      width: min(640px, calc(100% - 1.5rem));
      margin-bottom: max(1rem, env(safe-area-inset-bottom));
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      background: rgba(12, 12, 14, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease 0.2s;
    }
    #controls.ready {
      opacity: 1;
      pointer-events: auto;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1 1 auto;
      min-width: 140px;
    }
    .control-group label {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #c9a962;
      height: 4px;
      cursor: pointer;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #f5f5f5;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
    .btn:active { transform: scale(0.97); }
    #midi-status {
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.4);
    }
    #midi-status.active { color: #7dcea0; background: rgba(125,206,160,0.12); }

    #hint {
      position: fixed;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      pointer-events: none;
      text-align: center;
      padding: 0 1rem;
      opacity: 0;
      transition: opacity 0.5s ease 0.4s;
    }
    #hint.ready { opacity: 1; }

    @media (max-width: 520px) {
      #controls { flex-direction: column; align-items: stretch; }
      .control-group { min-width: 0; }
      #brand strong { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div id="error-panel" role="alert">
    <h1>WebGL unavailable</h1>
    <p id="error-message">Your browser does not support WebGL, which is required for the 3D viewer. Try updating your browser or enabling hardware acceleration.</p>
  </div>

  <div id="loading" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loading-text">Loading GP-9</div>
    <div id="loading-progress">Initialising…</div>
  </div>

  <div id="brand">
    <span>Roland</span>
    <strong>GP-9 Grand Piano</strong>
  </div>

  <p id="hint">Drag to orbit · Tap keys to play · Open the lid with the slider</p>

  <div id="canvas-wrap" aria-label="Interactive 3D grand piano viewer"></div>

  <div id="controls" aria-label="Viewer controls">
    <div class="control-group">
      <label for="lid-slider">Lid</label>
      <input id="lid-slider" type="range" min="0" max="100" value="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" />
    </div>
    <button type="button" class="btn" id="reset-camera">Reset view</button>
    <button type="button" class="btn" id="enable-audio">Enable sound</button>
    <span id="midi-status" title="MIDI input">MIDI —</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    /**
     * Roland GP-9 — standalone Three.js interactive viewer
     * No build step. Open via local server (e.g. npx serve public) or Next.js /gp9-viewer/
     */
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

    // -------------------------------------------------------------------------
    // DOM refs
    // -------------------------------------------------------------------------
    const wrap = document.getElementById("canvas-wrap");
    const loadingEl = document.getElementById("loading");
    const loadingProgress = document.getElementById("loading-progress");
    const controlsBar = document.getElementById("controls");
    const hintEl = document.getElementById("hint");
    const lidSlider = document.getElementById("lid-slider");
    const resetCameraBtn = document.getElementById("reset-camera");
    const enableAudioBtn = document.getElementById("enable-audio");
    const midiStatus = document.getElementById("midi-status");
    const errorPanel = document.getElementById("error-panel");
    const errorMessage = document.getElementById("error-message");

    // Model paths (relative to this HTML file in public/gp9-viewer/)
    const MODEL_CANDIDATES = [
      "../models/gp9_piano.glb",
      "../models/gp9-grand.glb",
      "./gp9_piano.glb",
    ];
    const HDRI_URL = "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/royal_esplanade_1k.hdr";
    const SALAMANDER_BASE = "https://tonejs.github.io/audio/salamander/";

    const NOTE_NAMES = ["C", "Cs", "D", "Ds", "E", "F", "Fs", "G", "Gs", "A", "As", "B"];
    const PRELOAD_NOTES = [48, 50, 52, 53, 55, 57, 59, 60, 62, 64, 65, 67, 69, 71, 72]; // C3–C5 range

    // -------------------------------------------------------------------------
    // WebGL guard
    // -------------------------------------------------------------------------
    function assertWebGL() {
      try {
        const c = document.createElement("canvas");
        const gl = c.getContext("webgl2") || c.getContext("webgl");
        if (!gl) throw new Error("WebGL not supported");
      } catch {
        errorPanel.classList.add("visible");
        loadingEl.classList.add("hidden");
        return false;
      }
      return true;
    }
    if (!assertWebGL()) throw new Error("WebGL required");

    // -------------------------------------------------------------------------
    // Renderer & scene
    // -------------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    // r165+ equivalent of legacy outputEncoding = sRGBEncoding
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 120);
    camera.position.set(2.8, 1.65, 3.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.4;
    controls.maxDistance = 9;
    controls.minPolarAngle = 0.25;
    controls.maxPolarAngle = Math.PI / 2 - 0.08;
    controls.target.set(0, 0.85, 0);
    controls.update();

    const defaultCameraPos = camera.position.clone();
    const defaultTarget = controls.target.clone();

    // Subtle fill — HDRI carries most of the lighting
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.35);
    keyLight.position.set(2, 4, 3);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xfff0dd, 0.18);
    rimLight.position.set(-3, 2, -2);
    scene.add(rimLight);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // -------------------------------------------------------------------------
    // Piano state
    // -------------------------------------------------------------------------
    let pianoRoot = null;
    let usingPlaceholder = false;
    let lidMesh = null;
    let lidPivot = null;
    let lidMixer = null;
    let lidAction = null;
    let lidOpenAmount = 0;
    const keyRegistry = new Map(); // mesh.uuid -> { mesh, restRotation, midi, animating }
    const activeKeyAnims = new Set();

    function setProgress(msg) {
      loadingProgress.textContent = msg;
    }

    function midiToNoteName(midi) {
      const octave = Math.floor(midi / 12) - 1;
      return `${NOTE_NAMES[midi % 12]}${octave}`;
    }

    function midiToSalamanderFile(midi) {
      return `${midiToNoteName(midi)}.mp3`;
    }

    function parseKeyName(name) {
      // key_white_C4, key_black_Db4, key_C4, key_Cs4, key_60
      const lower = name.toLowerCase();
      let m = lower.match(/^key_(?:white|black)_([a-g])([#b]?)(-?\d+)$/);
      if (m) {
        const note = m[1].toUpperCase();
        const acc = m[2];
        const oct = parseInt(m[3], 10);
        let semi = { C:0,D:2,E:4,F:5,G:7,A:9,B:11 }[note];
        if (acc === "#" || acc === "s") semi += 1;
        if (acc === "b") semi -= 1;
        return (oct + 1) * 12 + semi;
      }
      m = lower.match(/^key_([a-g])([#s]?)(-?\d+)$/);
      if (m) {
        const note = m[1].toUpperCase();
        const acc = m[2];
        const oct = parseInt(m[3], 10);
        let semi = { C:0,D:2,E:4,F:5,G:7,A:9,B:11 }[note];
        if (acc === "s" || acc === "#") semi += 1;
        return (oct + 1) * 12 + semi;
      }
      m = lower.match(/^key_(\d{2,3})$/);
      if (m) return parseInt(m[1], 10);
      return null;
    }

    // -------------------------------------------------------------------------
    // Easing tween (no external dependency)
    // -------------------------------------------------------------------------
    function tween({ from, to, duration, ease = (t) => 1 - Math.pow(1 - t, 3), onUpdate, onComplete }) {
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const v = from + (to - from) * ease(t);
        onUpdate(v);
        if (t < 1) requestAnimationFrame(frame);
        else onComplete?.();
      }
      requestAnimationFrame(frame);
    }

    function registerKey(mesh, midi) {
      const restRotation = mesh.rotation.x;
      keyRegistry.set(mesh.uuid, { mesh, restRotation, midi, pressed: false });
      mesh.userData.isPianoKey = true;
      mesh.userData.midi = midi;
    }

    function collectKeys(root) {
      root.traverse((obj) => {
        if (!obj.isMesh || !obj.name) return;
        const midi = parseKeyName(obj.name);
        if (midi !== null && midi >= 21 && midi <= 108) registerKey(obj, midi);
      });
    }

    function pressKey(mesh, velocity = 0.85) {
      const entry = keyRegistry.get(mesh.uuid);
      if (!entry || entry.pressed) return;
      entry.pressed = true;
      activeKeyAnims.add(entry);
      playNote(entry.midi, velocity);

      if (entry.clipAction) {
        entry.clipAction.reset().play();
        setTimeout(() => {
          entry.pressed = false;
          activeKeyAnims.delete(entry);
        }, 300);
        return;
      }

      const down = entry.restRotation - THREE.MathUtils.degToRad(10);
      tween({
        from: entry.mesh.rotation.x,
        to: down,
        duration: 45,
        onUpdate: (v) => { entry.mesh.rotation.x = v; },
        onComplete: () => {
          tween({
            from: entry.mesh.rotation.x,
            to: entry.restRotation,
            duration: 260,
            ease: (t) => t * (2 - t),
            onUpdate: (v) => { entry.mesh.rotation.x = v; },
            onComplete: () => {
              entry.pressed = false;
              activeKeyAnims.delete(entry);
            },
          });
        },
      });
    }

    function pressKeyByMidi(midi, velocity = 0.8) {
      for (const entry of keyRegistry.values()) {
        if (entry.midi === midi) {
          pressKey(entry.mesh, velocity);
          return;
        }
      }
    }

    // -------------------------------------------------------------------------
    // Lid control
    // -------------------------------------------------------------------------
    function setLidOpen(t) {
      lidOpenAmount = THREE.MathUtils.clamp(t, 0, 1);
      lidSlider.value = String(Math.round(lidOpenAmount * 100));
      lidSlider.setAttribute("aria-valuenow", lidSlider.value);

      if (lidAction) {
        lidAction.stop();
        lidAction.reset();
        lidAction.play();
        lidAction.paused = true;
        lidAction.time = lidOpenAmount * lidAction.getClip().duration;
      } else if (lidPivot) {
        // Placeholder / manual pivot: rotate lid backward
        lidPivot.rotation.x = -lidOpenAmount * THREE.MathUtils.degToRad(48);
      }
    }

    lidSlider.addEventListener("input", () => {
      resumeAudioIfNeeded();
      setLidOpen(parseInt(lidSlider.value, 10) / 100);
    });

    // -------------------------------------------------------------------------
    // Placeholder piano (credible grand silhouette)
    // -------------------------------------------------------------------------
    function createPolishedBlackMaterial() {
      return new THREE.MeshPhysicalMaterial({
        color: 0x0a0a0c,
        metalness: 0.15,
        roughness: 0.18,
        clearcoat: 1,
        clearcoatRoughness: 0.08,
        envMapIntensity: 1.2,
      });
    }

    function buildPlaceholderPiano() {
      usingPlaceholder = true;
      const root = new THREE.Group();
      root.name = "GP9_Placeholder";

      const bodyMat = createPolishedBlackMaterial();
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xc9a962,
        metalness: 0.9,
        roughness: 0.35,
        envMapIntensity: 1,
      });
      const feltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 });
      const whiteKeyMat = new THREE.MeshStandardMaterial({ color: 0xf4f0ea, roughness: 0.45, metalness: 0.02 });
      const blackKeyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.35, metalness: 0.05 });

      // Cabinet
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.55, 1.45), bodyMat);
      body.position.set(0, 0.42, 0.05);
      body.name = "body";
      root.add(body);

      // Cheek curves (simple cylinders)
      [-1, 1].forEach((side) => {
        const cheek = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 0.52, 24), bodyMat);
        cheek.position.set(side * 1.05, 0.42, 0.55);
        root.add(cheek);
      });

      // Keyboard bed
      const keybed = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.06, 0.42), feltMat);
      keybed.position.set(0, 0.78, 0.62);
      root.add(keybed);

      // Lid pivot group
      lidPivot = new THREE.Group();
      lidPivot.position.set(0, 0.82, -0.18);
      root.add(lidPivot);

      const lid = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.06, 1.55), bodyMat);
      lid.position.set(0, 0, 0.78);
      lid.name = "lid";
      lidMesh = lid;
      lidPivot.add(lid);

      // Inner rim / harp hint
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.018, 8, 48, Math.PI), goldMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.set(0, 0.8, 0.15);
      root.add(rim);

      // Keys — two octaves C3–B4 for interaction testing (expandable when GLB arrives)
      const whitePattern = [0, 2, 4, 5, 7, 9, 11];
      let whiteIndex = 0;
      const startMidi = 48;
      const endMidi = 71;
      const whiteW = 0.118;
      const blackW = 0.072;
      const keyDepth = 0.34;
      const keyY = 0.815;
      const keyZ = 0.78;

      for (let midi = startMidi; midi <= endMidi; midi++) {
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
        if (isBlack) continue;
        const x = -0.62 + whiteIndex * whiteW;
        whiteIndex++;
        const geo = new THREE.BoxGeometry(whiteW * 0.92, 0.045, keyDepth);
        geo.translate(0, 0, keyDepth / 2);
        const key = new THREE.Mesh(geo, whiteKeyMat.clone());
        key.name = `key_white_${midiToNoteName(midi)}`;
        key.position.set(x, keyY, keyZ);
        key.rotation.order = "XYZ";
        root.add(key);
        registerKey(key, midi);
      }

      for (let midi = startMidi; midi <= endMidi; midi++) {
        const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
        if (!isBlack) continue;
        const whiteIdxBefore = countWhitesBefore(midi, startMidi);
        const x = -0.62 + whiteIdxBefore * whiteW - blackW * 0.35;
        const geo = new THREE.BoxGeometry(blackW, 0.055, keyDepth * 0.62);
        geo.translate(0, 0, (keyDepth * 0.62) / 2);
        const key = new THREE.Mesh(geo, blackKeyMat.clone());
        key.name = `key_black_${midiToNoteName(midi)}`;
        key.position.set(x, keyY + 0.018, keyZ + 0.02);
        key.rotation.order = "XYZ";
        root.add(key);
        registerKey(key, midi);
      }

      // Pedals
      const pedalNames = ["pedal_soft", "pedal_sustain", "pedal_sostenuto"];
      [-0.14, 0, 0.14].forEach((x, i) => {
        const pedal = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.02, 16), goldMat);
        pedal.rotation.x = Math.PI / 2;
        pedal.position.set(x, 0.08, 1.05);
        pedal.name = pedalNames[i];
        root.add(pedal);
      });

      // Legs
      [[-0.85, -0.45], [0.85, -0.45], [0, 0.95]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.42, 12), bodyMat);
        leg.position.set(x, 0.21, z);
        root.add(leg);
      });

      root.position.y = 0;
      return root;
    }

    function countWhitesBefore(midi, start) {
      let count = 0;
      for (let m = start; m < midi; m++) {
        if (![1, 3, 6, 8, 10].includes(m % 12)) count++;
      }
      return count;
    }

    // -------------------------------------------------------------------------
    // GLB loading
    // -------------------------------------------------------------------------
    function createGLTFLoader() {
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/gltf/");
      loader.setDRACOLoader(draco);
      return loader;
    }

    async function tryLoadModel(url) {
      return new Promise((resolve, reject) => {
        createGLTFLoader().load(url, resolve, undefined, reject);
      });
    }

    function integrateGLTF(gltf) {
      const model = gltf.scene;
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = false;
          child.receiveShadow = false;
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((mat) => {
              if (mat.isMeshStandardMaterial || mat.isMeshPhysicalMaterial) {
                mat.envMapIntensity = mat.envMapIntensity ?? 1;
              }
            });
          }
        }
      });

      // Auto-scale to ~2.4m long if needed
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0 && (maxDim < 0.5 || maxDim > 8)) {
        const s = 2.2 / maxDim;
        model.scale.setScalar(s);
      }
      box.setFromObject(model);
      model.position.sub(box.getCenter(new THREE.Vector3()));
      model.position.y -= box.min.y;

      pianoRoot = model;
      scene.add(model);

      collectKeys(model);

      lidMesh = model.getObjectByName("lid") || null;
      if (gltf.animations?.length) {
        lidMixer = new THREE.AnimationMixer(model);
        const lidClip =
          gltf.animations.find((c) => c.name === "lid_open") ||
          gltf.animations.find((c) => /lid/i.test(c.name));
        if (lidClip) {
          lidAction = lidMixer.clipAction(lidClip);
          lidAction.setLoop(THREE.LoopOnce, 1);
          lidAction.clampWhenFinished = true;
          lidAction.play();
          lidAction.paused = true;
        }
      }
      // Bind key_press_* clips after keys are registered
      if (gltf.animations?.length && lidMixer) {
        gltf.animations.forEach((clip) => {
          const m = clip.name.match(/^key_press_(.+)$/i);
          if (!m) return;
          const midi = parseKeyName(`key_${m[1]}`);
          if (midi == null) return;
          for (const entry of keyRegistry.values()) {
            if (entry.midi === midi) {
              entry.clipAction = lidMixer.clipAction(clip);
              entry.clipAction.setLoop(THREE.LoopOnce, 1);
              entry.clipAction.clampWhenFinished = true;
            }
          }
        });
      }
      if (!lidAction && lidMesh) {
        lidPivot = new THREE.Group();
        const parent = lidMesh.parent;
        parent.remove(lidMesh);
        lidPivot.position.copy(lidMesh.position);
        lidPivot.position.y += 0.02;
        parent.add(lidPivot);
        lidMesh.position.set(0, -0.02, lidMesh.position.z > 0 ? 0.4 : 0.3);
        lidPivot.add(lidMesh);
      }
    }

    async function loadPianoModel() {
      setProgress("Loading 3D model…");
      for (const url of MODEL_CANDIDATES) {
        try {
          const gltf = await tryLoadModel(url);
          integrateGLTF(gltf);
          usingPlaceholder = false;
          setProgress(`Model loaded (${url.split("/").pop()})`);
          return;
        } catch {
          /* try next */
        }
      }
      setProgress("Using placeholder geometry (GLB not found)");
      pianoRoot = buildPlaceholderPiano();
      scene.add(pianoRoot);
    }

    // -------------------------------------------------------------------------
    // Environment (HDRI)
    // -------------------------------------------------------------------------
    async function loadEnvironment() {
      setProgress("Loading studio HDRI…");
      try {
        const hdr = await new Promise((resolve, reject) => {
          new RGBELoader().load(HDRI_URL, resolve, undefined, reject);
        });
        hdr.mapping = THREE.EquirectangularReflectionMapping;
        const envMap = pmremGenerator.fromEquirectangular(hdr).texture;
        scene.environment = envMap;
        scene.background = envMap;
        hdr.dispose();
        pmremGenerator.dispose();
      } catch (err) {
        console.warn("HDRI failed, using solid fallback:", err);
        scene.background = new THREE.Color(0x222222);
        scene.environment = null;
      }
    }

    // -------------------------------------------------------------------------
    // Audio — Salamander samples via Web Audio (Tone.js-free for lighter load)
    // -------------------------------------------------------------------------
    let audioCtx = null;
    let audioReady = false;
    const sampleCache = new Map();
    const pendingSamples = new Map();

    async function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") await audioCtx.resume();
      audioReady = true;
      enableAudioBtn.textContent = "Sound on";
      enableAudioBtn.disabled = true;
    }

    async function resumeAudioIfNeeded() {
      if (!audioReady) await ensureAudioContext();
    }

    enableAudioBtn.addEventListener("click", () => ensureAudioContext());

    async function fetchSample(midi) {
      if (sampleCache.has(midi)) return sampleCache.get(midi);
      if (pendingSamples.has(midi)) return pendingSamples.get(midi);

      const promise = (async () => {
        const url = SALAMANDER_BASE + midiToSalamanderFile(midi);
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("Sample missing");
          const buf = await res.arrayBuffer();
          const decoded = await audioCtx.decodeAudioData(buf);
          sampleCache.set(midi, decoded);
          return decoded;
        } catch {
          return null;
        } finally {
          pendingSamples.delete(midi);
        }
      })();
      pendingSamples.set(midi, promise);
      return promise;
    }

    function playFallbackTone(midi, velocity) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      const now = audioCtx.currentTime;
      const v = velocity * 0.35;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(v, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.65);
    }

    async function playNote(midi, velocity = 0.8) {
      if (!audioReady) return;
      let buffer = sampleCache.get(midi);
      if (!buffer) buffer = await fetchSample(midi);
      if (!buffer) {
        playFallbackTone(midi, velocity);
        return;
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.value = THREE.MathUtils.clamp(velocity, 0.05, 1) * 0.9;
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
    }

    async function preloadAudio() {
      setProgress("Preloading piano samples…");
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Don't resume until user gesture — preload buffers silently where allowed
      await Promise.all(PRELOAD_NOTES.map((m) => fetchSample(m).catch(() => null)));
    }

    // -------------------------------------------------------------------------
    // MIDI input
    // -------------------------------------------------------------------------
    async function initMidi() {
      if (!navigator.requestMIDIAccess) {
        midiStatus.textContent = "MIDI n/a";
        return;
      }
      try {
        const access = await navigator.requestMIDIAccess({ sysex: false });
        const handleMessage = (e) => {
          const [status, note, vel] = e.data;
          const cmd = status & 0xf0;
          if (cmd === 0x90 && vel > 0) {
            resumeAudioIfNeeded();
            pressKeyByMidi(note, vel / 127);
          } else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) {
            /* release handled by key animation */
          }
        };
        const bindInputs = () => {
          let connected = false;
          for (const input of access.inputs.values()) {
            input.onmidimessage = handleMessage;
            connected = true;
          }
          midiStatus.textContent = connected ? "MIDI on" : "MIDI —";
          midiStatus.classList.toggle("active", connected);
        };
        bindInputs();
        access.onstatechange = bindInputs;
      } catch {
        midiStatus.textContent = "MIDI err";
      }
    }

    // -------------------------------------------------------------------------
    // Pointer interaction
    // -------------------------------------------------------------------------
    function updatePointer(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(e) {
      if (e.target.closest("#controls")) return;
      resumeAudioIfNeeded();
      updatePointer(e.clientX, e.clientY);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      for (const hit of hits) {
        if (hit.object.userData.isPianoKey) {
          pressKey(hit.object, 0.75 + Math.random() * 0.2);
          e.preventDefault();
          return;
        }
      }
    }

    renderer.domElement.addEventListener("pointerdown", onPointerDown);

    resetCameraBtn.addEventListener("click", () => {
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      tween({
        from: 0,
        to: 1,
        duration: 750,
        ease: (t) => t * (2 - t),
        onUpdate: (t) => {
          camera.position.lerpVectors(startPos, defaultCameraPos, t);
          controls.target.lerpVectors(startTarget, defaultTarget, t);
          controls.update();
        },
        onComplete: () => {
          camera.position.copy(defaultCameraPos);
          controls.target.copy(defaultTarget);
          controls.update();
        },
      });
    });

    // -------------------------------------------------------------------------
    // Resize
    // -------------------------------------------------------------------------
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", onResize);

    // -------------------------------------------------------------------------
    // Animation loop
    // -------------------------------------------------------------------------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      controls.update();
      if (lidMixer) lidMixer.update(dt);
      renderer.render(scene, camera);
    }

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------
    async function boot() {
      try {
        await loadEnvironment();
        await loadPianoModel();
        await preloadAudio();
        await initMidi();
        animate();
        loadingEl.classList.add("hidden");
        controlsBar.classList.add("ready");
        hintEl.classList.add("ready");
      } catch (err) {
        console.error(err);
        errorMessage.textContent = err.message || "Failed to initialise the viewer.";
        errorPanel.classList.add("visible");
        loadingEl.classList.add("hidden");
      }
    }

    boot();
  </script>
</body>
</html>
