# Grafana dashboard provisioning
# Auto-loads all JSON dashboards from /var/lib/grafana/dashboards on first boot.

apiVersion: 1

providers:
  - name: "Vibe Music"
    orgId: 1
    folder: "Production"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
