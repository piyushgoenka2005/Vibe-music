# Nginx reverse proxy for Vibe Music (Next.js on :3000)
# Install:
#   sudo cp deploy/nginx/vibemusic.in.conf /etc/nginx/sites-available/vibemusic.in
#   sudo ln -sf /etc/nginx/sites-available/vibemusic.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream vibe_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS (enable after certbot)
server {
    listen 80;
    listen [::]:80;
    server_name vibemusic.in www.vibemusic.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibemusic.in www.vibemusic.in;

    # Certbot fills these paths after: certbot --nginx -d vibemusic.in -d www.vibemusic.in
    ssl_certificate     /etc/letsencrypt/live/vibemusic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibemusic.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets from Next.js build (long cache)
    location /_next/static/ {
        proxy_pass http://vibe_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://vibe_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400";
    }

    location /videos/ {
        proxy_pass http://vibe_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://vibe_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
