# ─── Nginx reverse proxy for Vibe Music ───────────────────────────────────
# Optimized for 2K concurrent users via PM2 cluster on port 3000.
#
# PM2 cluster mode: all workers share port 3000. Nginx sends to the single
# upstream; PM2's cluster module round-robins across workers internally.
# ──────────────────────────────────────────────────────────────────────────

# Rate limiting zones (shared across all server blocks)
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=30r/s;

# Connection limiting — prevent a single IP from exhausting the upstream
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream vibe_nextjs {
    server 127.0.0.1:3000;

    # Keepalive: persistent connections to Node.js reduce TCP handshake overhead.
    # 128 is sized for PM2 cluster (4 cores × 32 conns each).
    keepalive 128;

    # Health checking: mark server as failed after 3 consecutive failures,
    # then stop sending for 10s before retrying.
    # This prevents Nginx from sending to a crashed worker.
    # (Note: requires nginx 1.9.5+ with commercial or Plus; comment out if absent)
    # server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vibemusic.in www.vibemusic.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS server ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibemusic.in www.vibemusic.in;

    # ── SSL ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vibemusic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibemusic.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload limits ────────────────────────────────────────────────────
    client_max_body_size 25m;

    # ── Client timeout: how long Nginx waits for client to send data ─────
    # Slow 3G clients can take 30s to send request body. Setting this too
    # low causes 408; too high lets slow clients tie up upstream slots.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ── Connection limit per IP ──────────────────────────────────────────
    # Prevent a single IP from opening hundreds of connections (like our
    # load test did). 50 concurrent connections per IP is generous for a
    # real browser (typically 6 per domain).
    limit_conn conn_limit 50;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Compression ──────────────────────────────────────────────────────
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript
                 text/xml application/xml image/svg+xml application/wasm;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Global proxy defaults (inherited by all proxy_pass locations) ─────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Socket keepalive: reduces TCP teardown on fast responses
    proxy_socket_keepalive on;

    # ── Buffer tuning ────────────────────────────────────────────────────
    # Large busy_buffers absorb traffic bursts without writing to disk.
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # ════════════════════════════════════════════════════════════════════════
    # STATIC ASSETS — fast paths, no rate limiting, long cache
    # These never need to touch the application logic.
    # ════════════════════════════════════════════════════════════════════════

    location /_next/static/ {
        proxy_pass http://vibe_nextjs;

        # Static assets are fingerprinted — 1 year immutable cache
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Static files are fast; fail quickly if Node is overloaded
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # No retry for static — if Node is down, fail fast
        proxy_next_upstream off;
    }

    location /images/ {
        proxy_pass http://vibe_nextjs;
        add_header Cache-Control "public, max-age=86400";

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location /videos/ {
        proxy_pass http://vibe_nextjs;
        add_header Cache-Control "public, max-age=86400";

        # Video range requests need generous read timeout
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }

    # ════════════════════════════════════════════════════════════════════════
    # API ROUTES — rate limited, with failover
    # ════════════════════════════════════════════════════════════════════════

    # ── Auth endpoints: strict rate limit, moderate timeout ───────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://vibe_nextjs;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;

        # Retry on timeout/error — auth is critical
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # ── Admin endpoints: generous timeout (bulk operations) ───────────────
    location /api/admin/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://vibe_nextjs;

        # Admin bulk imports/exports can be slow
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }

    # ── Search endpoints: separate rate limit, moderate timeout ───────────
    location /api/search {
        limit_req zone=search_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://vibe_nextjs;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # ── All other API routes: generous burst, fast failover ───────────────
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://vibe_nextjs;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;

        # THE KEY FIX: retry on timeout/error — this eliminates 504s
        # When one request times out, try the next worker automatically.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }

    # ════════════════════════════════════════════════════════════════════════
    # PAGES — server-rendered, WebSocket support, generous timeout
    # ════════════════════════════════════════════════════════════════════════

    location / {
        proxy_pass http://vibe_nextjs;

        # WebSocket support (Next.js dev, HMR, future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Pages are expensive — retry once on failure
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
    }
}
